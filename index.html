/* ---------- 今日のまとめ */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); overflow: hidden; }
.summary div { padding: 12px 8px; text-align: center; border-right: 1px solid var(--line); }
.summary div:last-child { border-right: 0; }
.summary span { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.summary b { font-family: var(--f-disp); font-size: 20px; font-weight: 900; }
.summary b.plus { color: var(--good); } .summary b.minus { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { header.top { transition: none; } }
.next { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--comb); color: var(--comb-ink); border: 0; border-radius: var(--r); width: 100%; text-align: left; }
.next .cd { font-family: var(--f-disp); font-weight: 900; font-size: 26px; color: var(--honey); line-height: 1; min-width: 72px; }
.next .cd small { display: block; font-size: 10px; color: rgba(251,241,220,.6); font-weight: 700; margin-top: 4px; }
.next .what { min-width: 0; font-size: 13px; }
.next .what b { display: block; font-size: 15px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- おすすめ・買い目のカード */
.picks { display: grid; gap: 10px; }
.pick { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); text-align: left; width: 100%; }
.pick.s5 { border-color: var(--amber); background: linear-gradient(135deg, var(--soft), var(--panel) 60%); }
.pick .where { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; font-size: 12px; color: var(--muted); font-weight: 600; }   /* 札が入りきらなければ次の行へ(2026-10-29) */
.pick .where > span { white-space: nowrap; }
.pick .where .t { margin-left: auto; }
.pick .ph { min-width: 0; }
.pick .ph b { display: block; font-size: 17px; font-weight: 800; line-height: 1.25; white-space: normal; word-break: break-all; overflow-wrap: anywhere; }
/* 馬名は「…」で切らずに2行まで折り返す。着順の六角がある(結果が出た)カードは少し小さく(2026-10-29) */
.pick.has-fz .ph b { font-size: 15.5px; }
.pick .ph small { font-size: 12px; color: var(--muted); }
.pick .fig { text-align: right; line-height: 1.25; }
.pick .fig .o { font-family: var(--f-disp); font-weight: 900; font-size: 19px; }
.pick .fig .o small { font-size: 11px; color: var(--muted); font-weight: 700; }
.pick .fig .e { font-size: 12px; font-weight: 700; color: var(--accent); }
.pick.done-hit { border-color: var(--good); }
.pick.done-miss { opacity: .62; }

/* ---------- 狙いのリスト */
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
/* 会場の切り替え 案4: 電光板とおそろいの黒い板・光る会場名・下に次の発走(2026-10-29) */
.seg.vled { display: grid; grid-template-columns: repeat(var(--vn, 3), minmax(0, 1fr)); gap: 0; overflow: hidden; border: 3px solid #2c2c2c; border-radius: 6px; background: #050505; box-shadow: inset 0 0 10px #000; }
.seg.vled button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; padding: 6px 0 5px; border: 0; border-radius: 0; background: none; color: #8a7a52; font-weight: 900; }
.seg.vled button + button { border-left: 1px solid #262626; }
.seg.vled .vn { font-size: 15px; letter-spacing: .08em; line-height: 1.2; }
.seg.vled .vs { font-family: "DejaVu Sans Mono", "Menlo", "Consolas", ui-monospace, monospace; font-size: 10px; font-weight: 700; color: #8a7a52; }
.seg.vled .vs.nx { color: #58ff7a; text-shadow: 0 0 6px rgba(88,255,122,.8); }
.seg.vled button.on { background: rgba(255,176,0,.10); }
.seg.vled button.on .vn { color: #ffb000; text-shadow: 0 0 8px rgba(255,176,0,.9); }
.seg.vled button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #ffb000; box-shadow: 0 0 6px #ffb000; }
.seg.vled .c { display: none; }
.seg button { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--comb); color: var(--honey); border-color: var(--comb); }
.seg button .c { margin-left: 4px; font-size: 11px; opacity: .8; }
.list { overflow: hidden; }
.row { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: left; }
.row:last-child { border-bottom: 0; }
.row .when { font-size: 12px; color: var(--muted); line-height: 1.25; font-weight: 600; }
.row .when b { display: block; font-size: 14px; color: var(--ink); }
.row .main { min-width: 0; }
.row .main b { font-size: 15px; }
.row .why { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .right { text-align: right; font-size: 13px; line-height: 1.3; }
.row .right b { font-family: var(--f-disp); font-size: 16px; }

/* ---------- レース一覧 */
.races { overflow: hidden; }
.race { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: left; }
.race:last-child { border-bottom: 0; }
.race .rno { display: grid; place-items: center; height: 36px; font-family: var(--f-disp); font-weight: 900; font-size: 15px; background: linear-gradient(135deg, var(--honey), var(--amber)); color: var(--comb);
  clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 9px 100%, 0 50%); }
.race .rno.past { background: var(--line); color: var(--muted); }
.race .info { min-width: 0; }
.race .info b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.race .info small { font-size: 12px; color: var(--muted); }
.race .marks { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.race .side { text-align: right; font-size: 12px; }
.race .side .post { font-weight: 800; font-size: 14px; }

/* ---------- レース詳細(下から出るシート) */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--comb); color: var(--comb-ink); padding-top: env(safe-area-inset-top, 0px); border-bottom: 3px solid var(--honey); }
.sheet-head .wrap { display: flex; align-items: center; gap: 10px; min-height: 58px; }
.detail-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.detail-nav button { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 5px 9px; color: var(--ink); font-size: 12px; font-weight: 700; }
.detail-nav button:disabled { opacity: .4; }
.detail-nav span { color: var(--muted); font-size: 11px; }
.horse-sort { display: flex; overflow-x: auto; gap: 0; margin: 10px 0 4px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.horse-sort::-webkit-scrollbar { display: none; }
.horse-sort button { flex: none; min-height: 42px; border: 0; border-bottom: 2px solid transparent; padding: 10px 9px; background: none; color: var(--muted); font-size: 13px; font-weight: 800; white-space: nowrap; }
.horse-sort button.on { color: var(--accent); border-bottom-color: var(--accent); }
.horse-sort button.sm { padding-left: 4px; padding-right: 4px; font-size: 11px; }   /* 着順は細く */
.horse-sort button.on::after { content: "（" attr(data-direction) "）"; font-size: 10px; }
.back { border: 0; background: rgba(247,201,72,.12); color: var(--honey); width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.back svg { width: 20px; height: 20px; }
.sheet-title { min-width: 0; }
.sheet-title b { display: block; font-family: var(--f-disp); font-size: 17px; font-weight: 900; color: var(--honey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-title small { font-size: 12px; color: rgba(251,241,220,.72); }
.horses { display: grid; gap: 8px; padding-top: 16px; }
.horse { display: grid; grid-template-columns: auto auto 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.horse.buy { border-color: var(--amber); box-shadow: inset 4px 0 0 var(--amber); }
.race-ann { margin: 10px 0 2px; } .race-ann .cap { display: flex; align-items: center; gap: 8px; padding: 8px 12px 4px; font-size: 12px; font-weight: 800; color: var(--accent); }
.race-ann .cap .sub { margin-left: auto; font-weight: 500; color: var(--muted); }
h2.c-ann .sub { font-size: 10px; opacity: .8; }   /* 直前のお知らせの「件数・新しい順・下にスクロール」は小さく */
.race-ann-empty { margin: 10px 0 2px; font-size: 12px; }
.horse.focus { border-color: var(--honey); box-shadow: 0 0 0 3px rgba(247,201,72,.35), inset 4px 0 0 var(--honey); animation: focusGlow 1.1s ease-out 3; }
@keyframes focusGlow { 0% { box-shadow: 0 0 0 0 rgba(247,201,72,.9), inset 4px 0 0 var(--honey); } 100% { box-shadow: 0 0 0 10px rgba(247,201,72,0), inset 4px 0 0 var(--honey); } }
.horse .nm .you { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--honey); color: var(--comb); font-size: 10.5px; font-weight: 900; vertical-align: middle; }
.horse.won { background: linear-gradient(135deg, var(--good-soft), var(--panel) 70%); }
.horse .nm { min-width: 0; }
.horse .nm b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.horse .nm small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.horse .od { text-align: right; line-height: 1.2; }
.horse .od b { font-family: var(--f-disp); font-size: 17px; font-weight: 900; }
.horse .od small { display: block; font-size: 11px; color: var(--muted); }
.horse .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.meter { flex: 1 1 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 70px; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--honey), var(--amber)); border-radius: 3px; }
.ev-hi { color: var(--good); font-weight: 800; } .ev-lo { color: var(--muted); }
.fin { font-family: var(--f-disp); font-weight: 900; font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--line); color: var(--ink); }
.fin.f1 { background: var(--honey); color: var(--comb); } .fin.f2, .fin.f3 { background: var(--soft); color: var(--accent); }

/* ---------- 成績 */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--soft); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl { overflow-x: auto; }
.plus { color: var(--good); font-weight: 800; } .minus { color: var(--bad); font-weight: 800; }
@media (prefers-reduced-motion: reduce) { .refresh.spin svg { animation: none; } }
.refresh:active { transform: scale(.92); background: rgba(247,201,72,.25); }
.refresh.spin { background: rgba(247,201,72,.2); }
/* 更新ボタンを押したときの小さなお知らせ */
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); z-index: 50; max-width: calc(100% - 32px);
  padding: 9px 16px; border-radius: 999px; background: var(--comb); color: var(--comb-ink); border: 1px solid rgba(247,201,72,.5); box-shadow: 0 6px 18px rgba(0,0,0,.35);
  font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast b { color: var(--honey); }
/* ---------- 追加の部品(携帯版と同じ) */
.summary div { min-width: 0; padding-left: 4px; padding-right: 4px; }
h2 .sub.big { font-size: 17px; font-weight: 900; color: var(--comb); background: linear-gradient(135deg, var(--honey), var(--amber)); padding: 2px 12px; border-radius: 999px; letter-spacing: .04em; }
/* おすすめの頭数を大きく＋内訳(残り/確定)(D案・2026-10-29、携帯用と同じ) */
h2 .sub.os-count { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.os-count .osc-n { display: flex; align-items: baseline; gap: 2px; font-size: 13px; }
.os-count .osc-n b { font-size: 28px; font-weight: 800; line-height: 1; color: #b97c12; font-variant-numeric: tabular-nums; }
.os-count .osc-split { display: grid; font-size: 11px; line-height: 1.35; border-left: 1px solid #5e4d25; padding-left: 8px; white-space: nowrap; }
.os-count .osc-split b { font-size: 13px; color: var(--ink, #fbf1dc); font-variant-numeric: tabular-nums; }
.os-count .osc-split b.left { color: var(--good, #4fd197); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .os-count .osc-n b { color: #f0c75e; } }
:root[data-theme="dark"] .os-count .osc-n b { color: #f0c75e; }
.perf2 .cap small { font-weight: 500; color: var(--muted); margin-left: 4px; }
.perf2 .cap.alt2 { border-top: 1px dashed var(--line); margin-top: 2px; padding-top: 8px; color: var(--muted); }
.summary.alt2 { background: var(--soft); } .summary.alt2 b { font-size: 17px; opacity: .9; }
.summary b.money { font-size: clamp(11.5px, 3.5vw, 16px); letter-spacing: -.03em; overflow-wrap: anywhere; line-height: 1.6; display: block; }
.perf2 { overflow: hidden; }
.perf2 .cap { padding: 7px 12px 0; font-size: 11px; font-weight: 700; color: var(--accent); }
.perf2 .summary { border: 0; box-shadow: none; }
.perf2 .alt { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 12px; border-top: 1px dashed var(--line); background: var(--soft); font-size: 12px; color: var(--muted); }
.perf2 .alt b { color: var(--ink); font-family: var(--f-disp); }
main > * { min-width: 0; }
.star-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin: 12px 0 6px; font-size: 13px; font-weight: 800; }
.star-head small { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 600; }
.announce { overflow: hidden; }
.announce.scrollbox { max-height: 232px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.announce.scrollbox .ann:last-child { border-bottom: 0; }
.ann { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.ann:last-child { border-bottom: 0; }
.ann .at { font-size: 11px; color: var(--muted); font-weight: 700; text-align: center; line-height: 1.3; }
.ann .kind { display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 800; background: var(--soft); color: var(--accent); }
.ann .kind.k-急遽 { background: var(--bad-soft); color: var(--bad); }
.ann .kind.k-最終 { background: var(--good-soft); color: var(--good); }
.ann .tx { min-width: 0; font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.ann .tx button { border: 0; padding: 0; background: none; color: var(--accent); font-weight: 800; font-size: 12.5px; }
.fcount { gap: 5px !important; }
.fc { padding: 0 6px; border-radius: 5px; font-size: 10.5px; font-weight: 700; }
.fc.plus { background: var(--good-soft); color: var(--good); }
.fc.minus { background: var(--bad-soft); color: var(--bad); }
.row .fcount { display: flex; flex-wrap: wrap; gap: 4px !important; margin-top: 3px; }   /* 狙い・危険の一覧のファクターの数 */
.race-sort { display: flex; justify-content: flex-start; overflow-x: auto; margin: 4px 0 0; border-bottom: 1px solid var(--line); }
.sort-head, .horse-sort { display: flex; flex: none; gap: 0; overflow-x: auto; scrollbar-width: none; }
.sort-head::-webkit-scrollbar, .horse-sort::-webkit-scrollbar { display: none; }
.sort-head button, .horse-sort button { flex: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 7px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 800; white-space: nowrap; }
.sort-head button.on, .horse-sort button.on { color: var(--accent); border-bottom-color: var(--accent); }
.sort-head button.on::after, .horse-sort button.on::after { content: "（" attr(data-direction) "）"; font-size: 10px; }
.sort-head button:not(.on) { opacity: .75; }
.race-warn { margin: 6px 2px 0; font-size: 11px; color: var(--muted); line-height: 1.5; }
.result-row { grid-template-columns: 46px minmax(0, 1fr) auto; gap: 6px; padding: 9px 10px; }
.result-places { display: grid; gap: 3px; margin-top: 2px; }
.result-place { display: grid; grid-template-columns: 34px 23px minmax(0, 1fr); align-items: center; gap: 4px; font-size: 12px; line-height: 1.35; }
.result-place > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result-mark { color: var(--accent); font-size: 11px; font-weight: 900; text-align: center; }
.seg button.sig-over { color: var(--bad); border-color: var(--bad); }
.seg button.on.sig-over { background: var(--bad-soft); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
[hidden] { display: none !important; }
/* ---------- 合言葉の画面 */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.lock { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(520px 340px at 50% 18%, rgba(247,201,72,.28), transparent 70%), var(--comb); color: var(--comb-ink); }
.lock-card { width: 100%; max-width: 410px; display: grid; justify-items: center; gap: 10px; text-align: center; }
.lock-brand { display: grid; justify-items: center; gap: 8px; }
.lock-logo { display: block; width: auto; height: 112px; object-fit: contain; filter: drop-shadow(0 0 14px rgba(242,169,59,.18)); }
.lock-brand-en { font-family: "Cinzel", "Times New Roman", serif; font-weight: 700; font-size: 17px; letter-spacing: .2em;
  line-height: 1; white-space: nowrap; margin-left: 4px;
  background: linear-gradient(180deg, #fff3c4 0%, #f7c948 38%, #c9861a 62%, #ffe08a 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 rgba(0,0,0,.8)); }
.lock-sub { margin: 0; font-size: 14px; color: rgba(251,241,220,.78); }
#lockForm { width: 100%; display: grid; gap: 12px; margin-top: 14px; }
#pw { width: 100%; font-size: 18px; padding: 14px 16px; border-radius: 14px; border: 2px solid rgba(247,201,72,.45); background: rgba(255,255,255,.06); color: #fff; text-align: center; letter-spacing: .08em; }
#pw:focus { outline: none; border-color: var(--honey); box-shadow: 0 0 0 4px rgba(247,201,72,.2); }
#pw::placeholder { color: rgba(251,241,220,.45); }
.remember { font-size: 13px; color: rgba(251,241,220,.75); display: flex; gap: 8px; align-items: center; justify-content: center; }
#unlockBtn { border: 0; border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 900; font-family: var(--f-disp); color: var(--comb); background: linear-gradient(135deg, var(--honey), var(--amber)); box-shadow: 0 6px 18px rgba(232,150,43,.35); }
#unlockBtn:disabled { opacity: .7; }
.lock-err { margin: 0; min-height: 1.4em; color: #ff9aac; font-size: 13px; font-weight: 700; }
.lock-note { margin: 18px 0 0; font-size: 12px; color: rgba(251,241,220,.55); }
.lock-note b { color: var(--honey); }
.pick .fig .e { font-size: 11px; color: var(--muted); }
.pick .fig .o { color: var(--accent); }

/* ================================================================ 色で直感的に分かるように(全ページ共通の色ルール)
   緑=狙い・買い・プラス / 赤=危険・マイナス / 橙=過剰人気 / 空色=妙味(期待値) / 紫=紐 / 蜜色=おすすめ度・1着 */
:root { --aim: #16a34a; --aim-soft: #dcfce7; --dang: #e11d48; --dang-soft: #ffe4e6; --over: #ea7a11; --over-soft: #ffedd5;
  --evc: #0284c7; --evc-soft: #e0f2fe; --s5: #e11d48; --s4: #ea7a11; --s3: #d99a06; --s2: #8a7a5c; --silver: #9aa3ad; --bronze: #b5703a; }
:root:not([data-theme="light"]) { --aim: #4ade80; --aim-soft: #12382a; --dang: #fb7185; --dang-soft: #43182a; --over: #fdba74; --over-soft: #3b2410;
  --evc: #7dd3fc; --evc-soft: #0c2a3a; --s5: #fb7185; --s4: #fdba74; --s3: #f7c948; --s2: #b8a888; --silver: #cbd5e1; --bronze: #d9a06a; }

/* 下のタブ: 選んだタブごとに色 */

.stars.t5 { color: var(--s5); } .stars.t4 { color: var(--s4); } .stars.t3 { color: var(--s3); } .stars.t2 { color: var(--s2); }
.pick { border-left: 5px solid var(--line); }

.pick.s2 { border-left-color: var(--s2); }
.pick.done-hit { border-color: var(--aim); border-left-color: var(--aim); background: linear-gradient(135deg, var(--aim-soft), var(--panel) 60%); box-shadow: 0 0 0 2px var(--aim-soft); }

/* 印・サイン: 狙い=緑 危険=赤 過剰=橙 妙味=空色 紐=紫 */
.sig-badge, .pill.aim, .pill.danger, .pill.himo { font-size: 10.5px; padding: 2px 7px; border: 1px solid transparent; }

.sig-badge.ev { background: var(--evc-soft); color: var(--evc); border-color: var(--evc); }
.sig-badge.himo, .pill.himo { background: var(--himo-soft); color: var(--himo); border-color: var(--himo); }

.seg button.sig-danger, .seg button.sig-over { color: var(--dang); border-color: var(--dang); } .seg button.on.sig-danger { background: var(--dang); color: #fff; }

.row { border-left: 4px solid transparent; }
.row.sg-aim { border-left-color: var(--aim); } .row.sg-danger { border-left-color: var(--dang); } .row.sg-over { border-left-color: var(--over); }
.row.sg-ev { border-left-color: var(--evc); } .row.sg-himo { border-left-color: var(--himo); } .row.sg-cand { border-left-color: var(--evc); border-left-style: dashed; }

.horse.buy { border-left-color: var(--aim); border-color: var(--aim); box-shadow: none; background: linear-gradient(90deg, var(--aim-soft), var(--panel) 45%); }

.horse.sg-over { border-left-color: var(--over); }
.horse.sg-ev:not(.buy) { border-left-color: var(--evc); }
.horse.sg-himo:not(.buy) { border-left-color: var(--himo); }
.horse.won { border-color: var(--honey); background: linear-gradient(90deg, rgba(247,201,72,.35), var(--panel) 55%); }
/* 勝率バー: 高いほど濃く */
.meter { height: 7px; background: var(--line); }
.meter i { background: linear-gradient(90deg, #86efac, var(--aim) 60%, #15803d); }
/* 期待値: 1.3以上=濃い緑 / 1.1以上=緑 / 0.9未満=薄い赤 */

/* ---------- 視覚効果(的中バッジ・収支のふわっと表示・ゲージ・折れ線・脚質/馬場の絵文字) */
@keyframes hitPop { 0% { transform: scale(.5) rotate(-8deg); opacity: 0; } 60% { transform: scale(1.18) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }

.pill.hit { animation: hitPop .55s cubic-bezier(.2, 1.5, .4, 1) both, hitGlow 1.1s ease-out .4s 2; transform-origin: center; }
.pick.done-hit { position: relative; overflow: visible; }

.hit-badge { display: inline-block; padding: 2px 9px; border-radius: 999px; background: linear-gradient(135deg, #f7c948, #e0a200); color: #2b1d00; font-weight: 900; font-size: 11px; box-shadow: 0 2px 6px rgba(0,0,0,.25); animation: hitPop .6s cubic-bezier(.2, 1.5, .4, 1) both; }
.fin.f1 { animation: hitPop .5s cubic-bezier(.2, 1.5, .4, 1) both; }
.money { animation: riseIn .7s ease-out both; }
.money.plus { text-shadow: 0 0 14px rgba(34,197,94,.35); }
.money.plus::before { content: "▲ "; font-size: .8em; }
.money.minus::before { content: "▼ "; font-size: .8em; }
.summary b.plus:not(.money), td.plus b { animation: riseIn .7s ease-out .1s both; }
.dash { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.gauge { text-align: center; padding: 8px 4px 6px; }
.gauge svg { width: 100%; max-width: 150px; display: block; margin: 0 auto; overflow: visible; }
.g-bg { fill: none; stroke: var(--line); stroke-width: 11; stroke-linecap: round; }
.g-fg { fill: none; stroke-width: 11; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: gaugeFill 1.1s cubic-bezier(.3, .8, .3, 1) .15s forwards; }
.g-tick { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 2 2; }
.g-val { font-family: var(--f-disp); font-size: 21px; font-weight: 800; text-anchor: middle; }
.g-sub { font-size: 8.5px; fill: var(--muted); text-anchor: middle; }

.spark-line { width: 100%; height: auto; display: block; }

.spark-line .area { fill: var(--c); opacity: .16; }
.spark-line .line { fill: none; stroke: var(--c); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawLine 1.3s ease-out .1s forwards; }
.spark-line .dot { fill: var(--c); stroke: var(--panel); stroke-width: 2; }
.spark-line .val { font-family: var(--f-disp); font-weight: 800; font-size: 13px; fill: var(--c); }
.spark-line .ax { font-size: 9px; fill: var(--muted); }
.chart-card { padding: 10px 10px 6px; }
.chart-card .cap { margin-bottom: 4px; }
.style-tag { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 999px; font-size: 10.5px; font-weight: 800; white-space: nowrap; vertical-align: middle; }
.style-tag.st-nige { background: #ffe4e6; color: #be123c; } .style-tag.st-senko { background: #ffedd5; color: #c2410c; }
.style-tag.st-sashi { background: #e0f2fe; color: #0369a1; } .style-tag.st-oikomi { background: #ede9fe; color: #6d28d9; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .style-tag.st-nige { background: #43182a; color: #fb7185; } :root:not([data-theme="light"]) .style-tag.st-senko { background: #3b2410; color: #fdba74; }
  :root:not([data-theme="light"]) .style-tag.st-sashi { background: #0c2a3a; color: #7dd3fc; } :root:not([data-theme="light"]) .style-tag.st-oikomi { background: #2a2148; color: #c4b5fd; } }
:root[data-theme="dark"] .style-tag.st-nige { background: #43182a; color: #fb7185; } :root[data-theme="dark"] .style-tag.st-senko { background: #3b2410; color: #fdba74; }
:root[data-theme="dark"] .style-tag.st-sashi { background: #0c2a3a; color: #7dd3fc; } :root[data-theme="dark"] .style-tag.st-oikomi { background: #2a2148; color: #c4b5fd; }

/* ---- 2026-10-28 携帯用と同じ: 帯・お知らせ(2段・ランプ)・新しいお知らせの知らせ */
/* ホーム: 4つの箱を1行の帯に・最新のお知らせを大きな札に */
.ov-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

.ov-strip > div:first-child { border-left: 0; }

.ov-strip b { display: block; font-family: var(--f-disp); font-size: 13.5px; font-weight: 900; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-strip b.plus { color: var(--good); } .ov-strip b.minus { color: var(--bad); }
.ov-strip small { display: block; font-size: 9.5px; color: var(--muted); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-strip .skip { color: var(--over); }
.ann-hero { padding: 12px 14px; border: 2px solid var(--evc); box-shadow: 0 0 0 3px var(--evc-soft); display: grid; gap: 8px; }
.ann-hero.hot { border-color: var(--dang); box-shadow: 0 0 0 3px var(--dang-soft); }
.ann-hero.fin { border-color: var(--aim); box-shadow: 0 0 0 3px var(--aim-soft); }
.ann-hero.chg { border-color: var(--honey); box-shadow: 0 0 0 3px var(--soft); }
.ann-hero .ah-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ann-hero .kind { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 900; background: var(--soft); color: var(--accent); }
.ann-hero .kind.k-直前 { background: var(--evc-soft); color: var(--evc); } .ann-hero .kind.k-最終 { background: var(--aim-soft); color: var(--aim); } .ann-hero .kind.k-急遽 { background: var(--dang); color: #fff; }
.ann-hero .ah-time { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.ann-hero .ah-race { margin-left: auto; border: 0; padding: 0; background: none; color: var(--accent); font: 900 15px var(--f-disp); }
.ann-hero .ah-text { font-size: 14.5px; font-weight: 700; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.ann-hero .ah-more { justify-self: start; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--panel); color: var(--muted); font-size: 12px; font-weight: 700; }
.ann-hero .ah-list { margin: 0 -14px -12px; border-top: 1px solid var(--line); max-height: 260px; }
.ov-strip > button { min-width: 0; padding: 5px 6px 6px; text-align: center; border: 0; border-left: 1px solid var(--line); background: none; color: var(--ink); font: inherit; }
.ov-strip > button:first-child { border-left: 0; }
.ov-strip > button:active { background: var(--soft); }
.ov-strip > button:disabled { opacity: 1; }
.ov-strip > button span { color: var(--accent); }
.ov-strip > button:disabled span { color: var(--muted); }
@keyframes secFlash { 0% { box-shadow: 0 0 0 0 rgba(247,201,72,.0); } 30% { box-shadow: 0 0 0 4px rgba(247,201,72,.6); } 100% { box-shadow: 0 0 0 0 rgba(247,201,72,0); } }
#os-sec.flash { animation: secFlash 1.4s ease-out 1; border-radius: 14px; }
.nm .you.hit { background: var(--good); color: #fff; }
/* お知らせ 案A: 1行のティッカー(急遽・取消/乗り替わりは赤枠2行、発走10分前を切ったら2行) */
.ann-tick { padding: 0; overflow: hidden; border-left: 4px solid var(--evc); }
.ann-tick.k-最終 { border-left-color: var(--aim); }
.ann-tick.urgent { border: 2px solid var(--dang); border-left-width: 5px; box-shadow: 0 0 0 3px var(--dang-soft); }
.ann-tick .at-row { display: grid; gap: 4px; width: 100%; padding: 8px 12px 9px; border: 0; background: none; color: var(--ink); text-align: left; font: inherit; }
.ann-tick .at-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ann-tick .at-race { color: var(--accent); font-size: 13px; white-space: nowrap; }
.ann-tick .at-head .at-meta { margin-left: auto; }
.ann-tick .kind { padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 900; white-space: nowrap; background: var(--soft); color: var(--accent); }
.ann-tick .kind.k-直前 { background: var(--evc-soft); color: var(--evc); } .ann-tick .kind.k-最終 { background: var(--aim-soft); color: var(--aim); }
.ann-tick .kind.k-急遽, .ann-tick .kind.k-変更 { background: var(--dang); color: #fff; }
.ann-tick .at-tx { min-width: 0; font-size: 13.5px; font-weight: 700; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.ann-tick .at-tx.l1 { -webkit-line-clamp: 1; } .ann-tick .at-tx.l2 { -webkit-line-clamp: 2; }

.ann-tick .at-full { padding: 0 12px 10px; display: grid; gap: 4px; }
/* 一気に来たお知らせ(未読2件以上): 見切れないように全部広げる。押すか5分たつと1行に戻る */
.ann-tick.burst .at-tx { display: none; }

      box.addEventListener('click',onClick);document.body.appendChild(box);}
    draw();
  }
  function close(){if(box){box.remove();box=null;}inp=null;}
  function inMonth(y,m){var a=y+'-'+p2(m+1);return a>=min.slice(0,7)&&a<=max.slice(0,7);}
  function draw(){
    var h='<div class="cal">',today=ds(new Date());
    if(mode==='day'){
      h+='<div class="hd"><button class="ar" data-a="-1" aria-label="前の月"'+(inMonth(M===0?Y-1:Y,(M+11)%12)?'':' disabled')+'>&#8249;</button>'

        +'<button class="ar" data-a="1" aria-label="次の月"'+(inMonth(M===11?Y+1:Y,(M+1)%12)?'':' disabled')+'>&#8250;</button></div>'

      var f=new Date(Y,M,1).getDay(),n=new Date(Y,M+1,0).getDate();
      for(var i=0;i<f;i++)h+='<div></div>';
      for(var dd=1;dd<=n;dd++){var s=Y+'-'+p2(M+1)+'-'+p2(dd),r=isRace(s);
        h+='<div><button class="c'+(r?' r':'')+(s===sel?' on':'')+(s===today?' now':'')+'"'+(r?' data-d="'+s+'"':' disabled')+'>'+dd+'</button></div>';}
      h+='</div><div class="ft"><span>金の点 = 開催日</span><button data-a="today">今週</button></div>';
    }else{
      h+='<div class="hd"><button class="ar" data-a="-y" aria-label="前の年"'+(String(Y-1)>=min.slice(0,4)?'':' disabled')+'>&#8249;</button>'
        +'<button class="ttl" data-a="back">'+Y+'年</button>'
        +'<button class="ar" data-a="+y" aria-label="次の年"'+(String(Y+1)<=max.slice(0,4)?'':' disabled')+'>&#8250;</button></div><div class="mg">';
      for(var m=0;m<12;m++)h+='<button data-m="'+m+'"'+(Y+'-'+p2(m+1)===sel.slice(0,7)?' class="on"':'')+(inMonth(Y,m)?'':' disabled')+'>'+(m+1)+'月</button>';
      h+='</div>';
    }
    box.innerHTML=h+'</div>';
  }
  function pick(s){var el=inp;close();if(!el||!s)return;el.value=s;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}
  function onClick(e){
    if(e.target===box){close();return;}
    var b=e.target.closest('button');if(!b||b.disabled)return;
    var a=b.getAttribute('data-a');
    if(b.hasAttribute('data-d'))return pick(b.getAttribute('data-d'));
    if(b.hasAttribute('data-m')){M=+b.getAttribute('data-m');mode='day';return draw();}
    if(a==='-1'){M--;if(M<0){M=11;Y--;}}else if(a==='1'){M++;if(M>11){M=0;Y++;}}
    else if(a==='mon'){mode='mon';}else if(a==='back'){mode='day';}
    else if(a==='-y'){Y--;}else if(a==='+y'){Y++;}
    else if(a==='today'){var t=ds(new Date()),best='',ks=Object.keys(set).sort();for(var i=0;i<ks.length;i++){if(ks[i]<=t)best=ks[i];}
      if(!best||t>last){var d=new Date();while(d.getDay()!==6&&d.getDay()!==0)d.setDate(d.getDate()+1);best=ds(d);}return pick(best);}
    draw();

  function hit(e){var el=e.target&&e.target.closest&&e.target.closest(SEL);if(!el)return null;return el;}
  /* 標準のカレンダーを出さずにHIVEカレンダーを開く */
  var lastOpen=0;
  function go(e){var el=hit(e);if(!el)return;e.preventDefault();if(el.blur)el.blur();var now=Date.now();if(now-lastOpen<400)return;lastOpen=now;open(el);}
  document.addEventListener('touchend',go,{capture:true,passive:false});
  document.addEventListener('mousedown',go,true);
  document.addEventListener('click',function(e){if(hit(e))e.preventDefault();},true);
  document.addEventListener('focusin',function(e){var el=hit(e);if(el){el.blur();if(Date.now()-lastOpen>400){lastOpen=Date.now();open(el);}}},true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&box)close();},true);
})();

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

window.addEventListener("resize", () => {

const evf = e => e == null ? "—" : e.toFixed(2);
// 期待値は数字を出さず段階で(2026-10-29。期待値 ÷ 勝率 でオッズを逆算されないように)。eb: 1=プラス / -1〜-3 = 期待値マイナス☆の数

const EV_NOTE = "※期待値は当たりやすさではなく、勝率に対してオッズが割に合うか。金のしずくが多いほどお得、空のしずくは割高";

const EV_DROP = "M6 1c2.6 4 4.2 5.8 4.2 8.2a4.2 4.2 0 0 1-8.4 0C1.8 6.8 3.4 5 6 1z";

// data-count の数字を0から数え上げる(同じ数字は2回目からはそのまま表示)
const countSeen = new Set();
function runCountUps(root) {

  root.querySelectorAll("[data-count]").forEach(el => {
    const v = Number(el.dataset.count), key = el.closest("[class]")?.className + ":" + v;

/* ---------------------------------------------------------------- 視覚効果の部品(ゲージ・折れ線・脚質/馬場の絵文字) */
const STYLE_ICON = { "逃げ": "🐎", "先行": "🏃", "差し": "⚡", "追込": "🌪️" };

function gaugeSvg(roi, label, sub) {

  const [tx, ty] = pt(.5);

    <line x1="${tx}" y1="${(ty - 9).toFixed(1)}" x2="${tx}" y2="${(ty + 9).toFixed(1)}" class="g-tick"/>

// 収支の推移(累積)。points = [{date, value}]
function lineSvg(points, opt = {}) {
  if (!points || points.length < 2) return `<div class="note">まだ推移を描けるだけのデータがありません(2日以上の結果が出ると表示されます)</div>`;

  const x = i => L + i / (points.length - 1) * (W - L - R), y = v => T + (max - v) / ((max - min) || 1) * (H - T - B);

}
const fmtMD = s => { const m = String(s).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? `${+m[2]}/${+m[3]}` : s; };
const fmtYM = s => { const m = String(s).match(/(\d{4})-(\d{2})/); return m ? `${m[1]}/${+m[2]}` : s; };
const STAR_LABEL = { 5: "勝負", 4: "注目", 3: "狙い", 2: "買い" };
const roiCls = r => r == null ? "" : r >= 1 ? "plus" : "minus";
const factorSum = (x, key) => key === "fplus" ? (x.kp ?? 0) + (x.mp ?? 0) : (x.km ?? 0) + (x.mm ?? 0);
// ファクターは名前を出さず、数だけ
function factorLine(x) {
  if (x.kp == null) return "";

    + `<span class="fc plus">＋材料 ${x.mp}</span><span class="fc minus">−材料 ${x.mm}</span></div>`;

// おすすめの単勝成績: 直前の見送りを反映した「実際」をメインに、見送らなかった場合を下に
function recPerfBlock(rp, title) {

  const hasSkip = rp.source === "discord";
  const cap = hasSkip ? "見送りを反映した実際の成績<small>(直前・締切直前に見送った馬を除く)</small>" : "最新オッズでの判定<small>(この日は見送りの記録がありません)</small>";
  let h = `<section><h2>${title}<span class="sub big">単勝</span></h2><div class="card perf2"><div class="cap">${cap}</div>
    <div class="summary num">
      <div><span>頭数</span><b>${a.n ?? "—"}</b></div>
      <div><span>的中</span><b>${a.n ? `${a.hit}/${a.n}` : "—"}</b></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

}
async function decrypt(enc, pw) {

}

  const ds = S.snap.days.map(d => d.date).filter(d => d <= todayStr()), t = todayStr();

const fzBlock = f => f == null ? "" : `<span class="fz ${f <= 3 ? "f" + f : "fx"}" aria-label="${f}着"><span class="fz-hex">${f}</span><small>${f}着</small></span>`;

function jstAt(date, hm) {

const SIG_MODES = { all: ["すべて", "狙い", "妙味", "紐", "過剰", "危険"], buy: ["狙いすべて", "狙い", "妙味", "紐"], danger: ["危険すべて", "過剰", "危険"] };
const SIG_GROUP = { "すべて": ["狙い", "妙味", "紐", "過剰", "危険"], "狙いすべて": ["狙い", "妙味", "紐"], "危険すべて": ["過剰", "危険"] };
const SIG_CYCLE = ["all", "buy", "danger"];
const sigKindOf = x => x.sig && SIG_INFO[x.sig] ? x.sig : (x.himo ? "紐" : "");
const sigPick = (all, k) => all.filter(x => (SIG_GROUP[k] || [k]).some(g => g === "紐" ? x.himo : x.sig === g));
const sigLabel = x => x.sig === "過剰" ? "過剰人気" : x.sig === "危険" && x.lv >= 2 ? "かなり危険" : x.sig;
function viewSig(d) {
  const all = allHorses(d);
  const byPost = (a, b) => (a.post || "").localeCompare(b.post || "", "ja", { numeric: true }) || (a.rno - b.rno);
  const pick = k => sigPick(all, k).sort(byPost);
  const kinds = SIG_MODES[S.sigMode || "all"];
  if (!kinds.includes(S.sig)) S.sig = kinds[0];
  let h = `<div class="seg">${kinds.map(k => `<button data-sig="${k}" class="${S.sig === k ? "on" : ""} sig-${SIG_INFO[k][0]}">${SIG_INFO[k][1] ? SIG_INFO[k][1] + " " : ""}${SIG_GROUP[k] ? "すべて" : k}<span class="c">${pick(k).length}</span></button>`).join("")}</div>
    <p class="note" style="margin:0">※${SIG_INFO[S.sig][2]}</p>`;
  const list = pick(S.sig);
  if (!list.length) return h + `<div class="card empty">この日の「${esc(S.sig)}」はありません</div>`;
  // 並べ替え: 発走順(標準)・勝率・期待値・＋ファクター・−ファクター(全レースの表と同じ。馬番はなし)
  const sortKeys = [["p", "勝率"], ["eb", "期待値"], ["fplus", "＋ファクター"], ["fminus", "−ファクター"]];
  if (list.some(x => x.fin != null)) sortKeys.push(["fin", "着順"]);   // 結果が出ていれば着順でも並べ替え
  const { key: sk, dir: sd } = S.sigSort;
  const dirLabel = k => k === "post" ? (sd === "asc" ? "早い順" : "遅い順") : k === "fin" ? (sd === "asc" ? "1着から" : "下から") : (sd === "desc" ? "高い順" : "低い順");
  h += `<div class="horse-sort" aria-label="並べ替え(もう一度押すと昇順・降順が入れ替わります)"><button data-sig-sort="post" class="${sk === "post" ? "on" : ""}" data-direction="${dirLabel("post")}">発走順</button>${
    sortKeys.map(([k, label]) => `<button data-sig-sort="${k}" class="${sk === k ? "on" : ""}" data-direction="${dirLabel(k)}">${label.endsWith("順") ? label : label + "順"}</button>`).join("")}</div>`;
  if (sk === "eb") h += `<p class="note" style="margin:0">${EV_NOTE}</p>`;
  if (sk === "post") { if (sd === "desc") list.reverse(); }
  else {
    const val = x => sk === "fplus" || sk === "fminus" ? (x.kp == null ? null : factorSum(x, sk)) : sk === "eb" ? evBand(x) : x[sk];
    list.sort((a, b) => { const av = val(a), bv = val(b); if (av == null || bv == null) return av == null ? (bv == null ? byPost(a, b) : 1) : -1;   // 値が無い馬は最後
      return ((Number(av) - Number(bv)) * (sd === "asc" ? 1 : -1)) || byPost(a, b); });
  }
  const rowSg = { "狙い": "sg-aim", "危険": "sg-danger", "過剰": "sg-over", "妙味": "sg-ev", "紐": "sg-himo" }[S.sig] || "";
  const rowSgOf = k => ({ "狙い": "sg-aim", "危険": "sg-danger", "過剰": "sg-over", "妙味": "sg-ev", "紐": "sg-himo" }[k] || "");
  return h + `<div class="card list">` + list.map(x => { const k = SIG_GROUP[S.sig] ? (SIG_GROUP[S.sig].find(g => g === "紐" ? x.himo : x.sig === g) || "紐") : S.sig; return `<button class="row ${SIG_GROUP[S.sig] ? rowSgOf(k) : rowSg}" data-race="${esc(x.id)}" data-race-group="sig:${esc(S.sig)}" data-hno="${x.no ?? ""}">
    <div class="when num"><b>${esc(x.post || "")}</b>${esc(x.venue)}${x.rno}R</div>
    <div class="main"><b><span class="sig-badge ${SIG_INFO[k][0]}">${SIG_INFO[k][1]} ${esc(k === "紐" ? "紐" : sigLabel(x))}</span>${x.no ?? ""} ${esc(x.name)}</b>${x.mark ? ` <span class="hex ${markCls(x.mark)}" style="width:22px;height:20px;font-size:11px">${esc(x.mark)}</span>` : ""}
      ${x.fin != null ? ` <span class="fin ${x.fin <= 3 ? "f" + x.fin : ""}">${x.fin === 1 ? "👑 " : ""}${x.fin}着</span>` : ""}
      <span class="why">${x.st ? `<span class="stars t${x.st}">${starStr(x.st)}</span>` : ""}</span>${factorLine(x)}</div>
    <div class="right"><span class="num">勝率 ${pct(x.p, 0)}</span><br>${evMark(x)}</div></button>`; }).join("") + `</div>`;
}

// ===== レース一覧: タイムラインのカード(2026-10-29)。r = {id,no,course,cls,name,field,going,post,done,top:[{pos,no,fr,name,mark}],osN,hit}
const RT_MK = { "◎": "m-hon", "○": "m-tai", "▲": "m-tan", "△": "m-ren", "注": "m-chu", "穴": "m-ana", "☆": "m-hosi" };
const rtMk = (m, sm) => `<span class="rt-mk ${RT_MK[m] || "m-none"}${sm ? " sm" : ""}">${esc(m || "無")}</span>`;
const RT_GD = { "良": ["良", "g1"], "稍重": ["稍", "g2"], "重": ["重", "g3"], "不良": ["不", "g4"] };
const RT_TROPHY = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V17h3v2H8v-2h3v-2.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3zm0 4H6v1a2 2 0 0 0 1.2 1.8A5 5 0 0 1 7 8.5V7zm10 0v1.5c0 .4 0 .9-.2 1.3A2 2 0 0 0 18 8V7h-1z"/><rect x="7" y="20" width="10" height="2" rx="1"/></svg>`;
function rtWaku(no, field, fr) {
  if (fr) return fr;
  no = Number(no); field = Number(field);
  if (!no || !field) return 0;
  if (field <= 8) return no;
  const base = Math.floor(field / 8), extra = field % 8;
  let n = 0;
  for (let w = 1; w <= 8; w++) { n += base + (w > 8 - extra ? 1 : 0); if (no <= n) return w; }
  return 8;
}
function rtCard(r, isNext, isToday) {
  const s = String(r.course || ""), surf = s[0] === "芝" ? "turf" : s[0] === "障" ? "jump" : "dirt";
  const surfJa = { turf: "芝", dirt: "ダート", jump: "障害" }[surf], dist = s.replace(/^(芝|ダート|ダ|障害|障)/, "");
  const cls = String(r.cls || "").replace("以上", "上").replace(/クラス$/, ""), graded = /G|重賞|L|OP|オープン/.test(cls);
  const showName = r.name && r.name !== r.cls && !/(新馬|未勝利|[123]勝|クラス|オープン)$/.test(r.name);   // 特別戦・重賞の名前だけ出す
  const gd = RT_GD[r.going];
  const l1 = `<div class="rt-l1">${cls ? `<span class="rt-cls${/新馬/.test(cls) ? " new" : graded ? " g" : ""}">${esc(cls)}</span>` : ""}${showName ? `<span class="rt-name">${esc(r.name)}</span>` : ""}
    <span>${esc(dist)}</span><span>${r.field ?? ""}頭</span>${gd ? `<span class="rt-gd ${gd[1]}" title="馬場 ${esc(r.going)}">${gd[0]}</span>` : ""}<span class="rt-post num">${esc(r.post || "")}</span></div>`;
  let l2;
  if (r.done && r.top.length) {
    const w = r.top[0], rest = r.top.slice(1);
    l2 = `<div class="rt-win"><span class="rt-trophy${r.hit ? " gold" : ""}" title="${r.hit ? "おすすめが的中" : ""}">${RT_TROPHY}</span><span class="waku w${rtWaku(w.no, r.field, w.fr)}">${w.no ?? "—"}</span><b>${esc(w.name || "")}</b>${rtMk(w.mark)}</div>
      ${rest.length || r.osN || r.lowN ? `<div class="rt-sub">${rest.map(x => `<span>${x.pos}着 <span class="rt-num waku w${rtWaku(x.no, r.field, x.fr)}">${x.no ?? "—"}</span>${rtMk(x.mark, true)}</span>`).join("")}${r.osN ? `<span class="rt-os${r.hit ? " hit" : " miss"}">${r.osSt ? tierHtml(r.osSt) : "おすすめ"} ${r.osN}頭 ${r.hit ? "的中" : "はずれ"}</span>` : r.lowN ? `<span class="rt-os low"><span class="stars">${starStr(1)}</span> ${r.lowN}頭</span>` : ""}</div>` : ""}`;   // 結果が出たあとも、おすすめ馬がいたレースには札を残す(2026-10-29)
  } else {
    const pd = postDate(r.post), started = pd && pd <= Date.now();
    const os = r.osN ? `<span class="rt-os">${r.osSt ? tierHtml(r.osSt) : "おすすめ"} ${r.osN}頭が出走</span>` : r.lowN ? `<span class="rt-os low"><span class="stars">${starStr(1)}</span> ${r.lowN}頭</span>` : "";
    l2 = isNext
      ? `<div class="rt-pre"><span class="rt-cd">発走まであと <span data-cd="${esc(r.post)}" data-fallback="まもなく"></span></span>${os}</div><div class="rt-pre"><span class="go">予想を見る ›</span></div>`
      : `<div class="rt-pre"><span>${started ? "結果待ち" : "発走前"}・予想を見る ›</span>${os}</div>`;
  }
  return `<div class="rt-row${r.done ? " done" : ""}${r.hit ? " hit" : ""}${isNext ? " rt-next" : ""}"><button class="rt-card" data-race="${esc(r.id)}" data-race-group="race">
    <div class="rt-side ${surf}"><b>${r.no}R</b><small>${r.venue ? esc(r.venue) : surfJa}</small></div><div class="rt-body">${l1}${l2}</div></button></div>`;
}
function raceTimeline(list, order, isToday, byPost, cmp) {
  const asc = [...list].sort(cmp || ((a, b) => byPost ? (a.post || "").localeCompare(b.post || "") || a.no - b.no : a.no - b.no));
  const doneN = asc.filter(r => r.done).length, now = Date.now();
  const byTime = [...list].sort((a, b) => (a.post || "").localeCompare(b.post || "") || a.no - b.no);
  const next = isToday ? byTime.find(r => !r.done && postDate(r.post) && postDate(r.post) > now) : null;   // 「次」は並べ方に関係なく発走の早いもの
  const pct = asc.length ? Math.round(doneN / asc.length * 100) : 0;
  const tail = next ? `次は<em>${esc(next.venue || "")}${next.no}R ${esc(next.post)}</em>` : doneN === asc.length && asc.length ? "全レース終了" : isToday ? "結果待ち" : "";
  let h = `<div class="rt-prog"><div class="rt-prog-top"><b>${doneN}/${asc.length}R 終了</b><span>${tail}</span></div><div class="rt-bar"><i style="width:${pct}%"></i></div></div>`;
  const rows = order === "desc" ? asc.slice().reverse() : asc;
  return h + `<div class="rt-list">${rows.map(r => rtCard(r, next && r.id === next.id, isToday)).join("")}</div>`;
}

function viewRaces(d) {
  if (S.raceMode === "result") return `<section id="res-sec"><h2>${esc(d.label)} の全レース結果</h2>${resultsList(d)}</section><p class="note">もう一度「結果」タブを押すと、レースの一覧に戻ります</p>`;
  const vs = d.venues;
  if (!vs.length) return `<div class="card empty">レースがありません</div>`;
  if (!vs.some(v => v.venue === S.venue)) { S.venue = vs[0].venue; S.venuePicked = false; }   // 一覧の表示用に先頭を出すだけ(選んだことにはしない)
  const view = ["order", "post", "os"].includes(S.raceView) ? S.raceView : "order";   // 携帯と同じ: レース順・発走順(全会場)・★あり(2026-10-29)
  let h = `<div><div class="seg vled" style="--vn:${vs.length}">${vs.map(x => `<button data-venue="${esc(x.venue)}" class="${view === "order" && S.venuePicked && x.venue === S.venue ? "on" : ""}"><span class="vn">${esc(x.venue)}</span>${venueSub(x, S.date === todayStr())}</button>`).join("")}</div>
  <p class="race-warn">※全レースの予想を載せていますが、全レースを買うと回収率はマイナスになります。買うのは「おすすめ」の馬にしぼり、ここは参考としてご覧ください。</p>
    <div class="race-sort"><div class="sort-head">
      <button data-race-view="order" class="${view === "order" ? "on" : ""}" data-direction="${S.raceOrder === "asc" ? "昇順" : "降順"}" aria-label="レース順(もう一度押すと昇順・降順が入れ替わります)">レース順</button>
      <button data-race-view="post" class="${view === "post" ? "on" : ""}" data-direction="${S.raceOrder === "asc" ? "早い順" : "遅い順"}" aria-label="全会場まとめて発走順">発走順</button>
      <button data-race-view="os" class="${view === "os" ? "on" : ""}" data-direction="${S.raceOrder === "asc" ? "★多い順" : "★少ない順"}" aria-label="★の馬がいるレースだけ(もう一度押すと★の多い順・少ない順が入れ替わります)">★あり</button>
    </div></div></div>`;
  const osAll = d.osusume || [], os = osAll.filter(o => (o.st || 0) >= 2);   // おすすめとして数えるのは★2以上。★1は薄い札だけ
  const toItem = (r, venue) => {
    const top = [1, 2, 3].map(p => r.horses.find(h => h.fin === p)).filter(Boolean).map(h => ({ pos: h.fin, no: h.no, fr: h.fr, name: h.name, mark: h.mark }));
    return { id: r.id, no: r.no, course: r.course, cls: r.cls || "", name: r.name || "", field: r.field, going: r.going, post: r.post, venue,
      done: !!(r.done && top.length), top, osN: os.filter(o => o.id === r.id).length, osSt: Math.max(0, ...os.filter(o => o.id === r.id).map(o => o.st || 0)), lowN: (r.horses || []).filter(h => (h.st || 0) === 1).length, hit: os.some(o => o.id === r.id && o.fin === 1) };
  };
  let list;
  if (view === "order") list = (vs.find(x => x.venue === S.venue).races || []).map(r => toItem(r, ""));
  else {
    list = vs.flatMap(x => (x.races || []).map(r => toItem(r, x.venue)));
    if (view === "os") list = list.filter(r => r.osN > 0 || r.lowN > 0);

  S.raceSeq = [...list].sort(cmp).map(r => r.id);

  return h + `<p class="note">もう一度「レース」タブを押すと、この日の全レース結果(1着〜3着)に切り替わります</p>`;
}

// 回収率の推移(累積)。公開データの curve(本体で計算・整数%)を使う。値は「100%からの差」(0の線 = 100%)
function publicCurve() {
  if (Array.isArray(S.snap.curve)) return S.snap.curve.map(c => ({ date: c.date, value: Math.round(c.roi * 100) - 100 }));
  const pts = []; let inv = 0, pay = 0;   // 古い公開データ(curve が無い)
  for (const day of [...S.snap.days].sort((a, b) => a.date.localeCompare(b.date))) {
    const a = day.rec_perf?.actual; if (!a?.n || a.profit == null) continue;
    const i = a.invest ?? a.n * 1000; inv += i; pay += a.payout ?? i + a.profit;
    pts.push({ date: day.date, value: Math.round(pay / inv * 100) - 100 });
  }
  return pts;
}
function perfDashboard(d, rp) {
  const per = S.snap.period || {};
  const today = rp?.actual;
  const pts = publicCurve();
  const pm = x => x && x.n && x.roi != null ? { roi: x.roi, n: x.n, hit: x.hit } : null;   // 金額は使わない(回収率だけ)
  const osN = (d.osusume || []).length;   // この日のおすすめの頭数(0なら「おすすめなし」と出す)
  const dayEmpty = osN ? `結果待ち(おすすめ${osN}頭)` : "この日はおすすめの馬がいませんでした";
  const periods = { day: { lab: d.label, tab: "この日", empty: dayEmpty, ...(pm(today) || {}) }, month: { lab: "今月", ...(pm(per.month) || {}) },
    year: { lab: `今年${per.year?.label ? `(${per.year.label})` : ""}`, ...(pm(per.year) || {}) } };
  let h = `<section><h2>ひと目でわかる成績<span class="sub">おすすめ・単勝</span></h2>${moneyA(periods, S.moneyPer || "day", "data-money-per")}<div class="dash">`;
  h += gaugeSvg(today?.n ? today.roi : null, `${esc(d.label)}`, today?.n ? `${today.hit}/${today.n}的中` : (osN ? `結果待ち・おすすめ${osN}頭` : "おすすめなし"));
  h += gaugeSvg(per.month?.n ? per.month.roi : null, "今月", per.month?.n ? `${per.month.hit}/${per.month.n}的中` : "まだ結果なし");
  h += `</div><div class="dash">`;
  h += gaugeSvg(per.year?.n ? per.year.roi : null, `今年${per.year?.label ? `(${esc(per.year.label)})` : ""}`, per.year?.n ? `${per.year.hit}/${per.year.n}的中` : "—");
  const rs = S.snap.rec_stats;
  h += gaugeSvg(rs?.roi ?? null, "2013年〜の検証", rs ? `年${rs.per_year}点 ・ プラスの年 ${esc(rs.plus_years || "")}` : "—");
  h += `</div><div class="card chart-card"><div class="cap">回収率の推移<small>(この90日・累積)</small></div>${lineSvg(pts, { fmt: fmtMD, fmtV: v => (v + 100) + "%", label: "回収率の推移" })}</div>
    <p class="note">※データの権利の関係で、配布用にはオッズ・払戻・金額を載せていません。1日の回収率も、1レースごとの払戻が分からないよう10%きざみにしています。オッズ・払戻はJRA公式の出馬表・レース結果で確認してください。</p></section>`;
  return h;
}

function viewPerf(d) {
  const p0 = d.perf || {};
  const rp = d.rec_perf || (p0.n ? { source: "app", actual: { n: p0.n, hit: p0.hit, hit_rate: p0.hit / p0.n, roi: p0.roi, profit: p0.roi == null ? null : (p0.roi - 1) * p0.n * 1000 } } : null);

  const per = S.snap.period;
  if (per) {
    h += `<section><h2>今月・今年のおすすめ成績<span class="sub">★2〜5・単勝</span></h2>${periodCard("今月", per.month)}${periodCard("今年", per.year)}
      <p class="note">※おすすめ★2〜5のうち結果が確定した分の集計です</p></section>`;
  } else {   // 古い公開データ(今月・今年の集計がまだ無い)ときは、手元の90日分から今月だけ数える

    const monthPicks = S.snap.days.filter(day => day.date.startsWith(currentMonth)).flatMap(day => day.osusume || []);
    const fin = monthPicks.filter(pick => pick.fin != null), hits = fin.filter(pick => pick.fin === 1);
    const ret = hits.reduce((s, x) => s + (x.pay || 0), 0);
    h += `<section><h2>今月のおすすめ成績<span class="sub">${esc(currentMonth)}</span></h2>${periodCard("今月", {
      label: currentMonth, n: fin.length, hit: hits.length, hit_rate: fin.length ? hits.length / fin.length : null,
      roi: fin.length && hits.every(x => x.pay != null) ? ret / fin.length : null, days: new Set(S.snap.days.filter(day => day.date.startsWith(currentMonth) && (day.osusume || []).some(x => x.fin != null)).map(day => day.date)).size,
      races: new Set(fin.map(x => x.id)).size, streak: 0 })}</section>`;
  }

      [...hs].sort((a, b) => b.p - a.p).forEach((h, i) => h.mark = ["◎", "○", "▲", "△", "☆"][i] || "");
      hs.forEach(h => { h.st = h.ev0 >= 1.1 && h.ev0 < 1.7 && h.p >= .15 ? 5 : h.ev0 >= 1.1 && h.ev0 < 1.7 && h.p >= .1 ? 4 : h.ev0 >= 1.1 && h.ev0 < 1.7 ? 3 : 0;

        h.mp = Math.floor(rnd() * 3); h.mm = Math.floor(rnd() * 2); h.buy = h.st >= 2; h.lv = h.sig === "危険" ? 1 : 0; });
      if (done) [...hs].sort((a, b) => b.p * (0.4 + rnd()) - a.p * (0.4 + rnd())).forEach((h, i) => h.fin = i + 1);
      const id = `${t}-${vi}-${no}`, name = no === 11 ? (vi === 1 ? "ハニカムステークス" : "ミツバチ特別") : ["2歳未勝利", "3歳以上1勝クラス", "2歳新馬", "3歳以上2勝クラス"][no % 4];
      races.push({ id, no, name, post, course: (no % 3 ? "芝" : "ダ") + [1200, 1400, 1600, 1800, 2000, 2400][no % 6] + "m", field: n, going: "良", st: Math.max(0, ...hs.map(h => h.st)), done, ai: true,
        horses: hs.map(({ w, ev0, ...h }) => ({ ...h, fin: done ? h.fin : null })) });
      hs.filter(h => h.st >= 2).forEach(h => os.push({ id, venue: v, no, post, hno: h.no, name: h.name, p: h.p, ev: h.ev, st: h.st, fin: done ? h.fin : null }));
    }
    venues.push({ venue: v, races });
  });
  os.sort((a, b) => b.st - a.st || a.post.localeCompare(b.post, "ja", { numeric: true }));
  const done = os.filter(x => x.fin != null);
  const snap = { v: 1, updated: t + "T" + new Date(Date.now() + 9 * 3600e3).toISOString().slice(11, 16),
    days: [{ date: t, label: lbl(t), venues, osusume: os,
      baba: [{ venue: "東京", tenko: "晴", shiba: "良", dirt: "稍重", time: "9:50" }, { venue: "京都", tenko: "曇", shiba: "良", dirt: "良", time: "9:50" },
        { venue: "新潟", tenko: "小雨", shiba: "稍重", dirt: "重", time: "9:50" }], perf: { n: done.length, hit: done.filter(x => x.fin === 1).length, roi: done.length ? 1.18 : null } }],
    star_guide: { 5: { label: "勝負", roi: 1.29, hit: .229 }, 4: { label: "注目", roi: 1.41, hit: .079 }, 3: { label: "狙い", roi: 1.19, hit: .047 }, 2: { label: "買い", roi: 1.10, hit: .048 } } };
  return { snap };
})();
